<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review form">
    <meta name="author" content="Scott Starkey">
    <title>Product Review Form</title>

    <link rel="stylesheet" href="form.css">
    <script src="form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>
                    Select a Product...
                </option>
            </select>
            <fieldset>
                <legend>Overall Rating</legend>
                <div class="rating">
                    <label for="rating1">⭐
                        <input type="radio" id="rating1" name="rating" value="1"></label>
                    <label for="rating2">⭐⭐
                        <input type="radio" id="rating2" name="rating" value="2"></label>
                    <label for="rating3">⭐⭐⭐
                        <input type="radio" id="rating3" name="rating" value="3"></label>
                    <label for="rating4">⭐⭐⭐⭐
                        <input type="radio" id="rating4" name="rating" value="4"></label>
                    <label for="rating5">⭐⭐⭐⭐⭐
                        <input type="radio" id="rating5" name="rating" value="5"></label>

                </div>
            </fieldset>
            <label for="installation">Date of Installation</label>
            <input type="date" id="installation" name="installation" required>
            <fieldset>
                <legend>
                    Which features did you find useful in the product?
                    <span class="optional">(Check all that apply)</span>
                </legend>
                <label>
                    <input type="checkbox" id="durability" name="features" value="durability">Durability
                </label>
                <label>
                    <input type="checkbox" id="easeOfUse" name="features" value="easeOfUse">Ease of Use
                </label>
                <label>
                    <input type="checkbox" id="performance" name="features" value="performance">Performance
                </label>
                <label>
                    <input type="checkbox" id="design" name="features" value="design">Design
                </label>
            </fieldset>
            <label for="review">
                Written Review <span class="optional">(Optional)</span>
            </label>

            <textarea id="review" name="review" rows="6">
                </textarea>
            <label for="userName">
                Your Name <span class="optional">(Optional)</span>
            </label>
            <input type="text" id="userName" name="userName">
            <input type="submit" id="submit" name="submit" value="Post Review">
        </form>

        <footer>
            <p>
                &copy; <span id="currentYear"></span> Scott Starkey | California
            </p>
            <p id="lastModified"></p>
        </footer>
    </main>
</body>

</html>
